<title>CEATEC 2026 訪問リスト</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@500;700&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap">
<style>
/* Layout: 展示会場の「回る順」を軸に。上部固定バーに件数、本文は1カラムのリスト、訪問プランはホール別・ブース順 */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --ink:#141a2e; --muted:#5d657c; --line:#dce1ea;
  --accent:#1d4ed8; --accent-soft:#e3eafc; --done:#15803d; --done-soft:#dcf2e3; --warn:#b42318;
  --a-gen:#0c1a49; --a-x:#7c3aed; --a-next:#d02ca8; --a-global:#00a58e;
  --f-display:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI",sans-serif;
  --f-body:"IBM Plex Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Consolas",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1220; --surface:#161b2b; --ink:#e7eaf3; --muted:#9aa2b9; --line:#283047;
  --accent:#86a8ff; --accent-soft:#1d2a4d; --done:#4ade80; --done-soft:#12301f; --warn:#f97066;
  --a-gen:#93a6e6; --a-x:#b28cff; --a-next:#f27ad6; --a-global:#3fe0c5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1220; --surface:#161b2b; --ink:#e7eaf3; --muted:#9aa2b9; --line:#283047;
  --accent:#86a8ff; --accent-soft:#1d2a4d; --done:#4ade80; --done-soft:#12301f; --warn:#f97066;
  --a-gen:#93a6e6; --a-x:#b28cff; --a-next:#f27ad6; --a-global:#3fe0c5; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;margin:0}
.wrap{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.hd{max-width:880px;margin:0 auto;padding:12px 16px 0;display:flex;flex-wrap:wrap;align-items:end;gap:8px 16px}
.brand{flex:1 1 260px;min-width:0}
.brand h1{font-family:var(--f-display);font-weight:900;font-size:1.45rem;line-height:1.2;margin:0;letter-spacing:.01em;text-wrap:balance}
.brand p{margin:2px 0 0;color:var(--muted);font-size:.8rem}
.tally{display:flex;gap:6px;font-variant-numeric:tabular-nums}
.tally span{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:.82rem;white-space:nowrap}
.tally b{font-family:var(--f-mono);font-size:1rem;margin-right:2px}
.tally .t-go b{color:var(--accent)} .tally .t-done b{color:var(--done)}
.tabs{max-width:880px;margin:0 auto;padding:8px 16px 0;display:flex;gap:4px}
.tabs button{border:0;background:none;padding:8px 14px 10px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.controls{display:grid;gap:10px;padding-block:16px 8px}
.search{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.82rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted));flex:none}
select.chip{padding-right:8px}
.count{color:var(--muted);font-size:.82rem;font-variant-numeric:tabular-nums;margin-left:auto}

.list{display:grid;gap:0;border-top:1px solid var(--line)}
.ex{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;padding:12px 4px;border-bottom:1px solid var(--line);align-items:start}
.ex.on{background:var(--accent-soft)}
.ck{width:22px;height:22px;margin:2px 0 0;accent-color:var(--accent);cursor:pointer}
.ex h3{font-size:1rem;font-weight:700;margin:0;line-height:1.4;overflow-wrap:anywhere}
.ex h3 label{cursor:pointer}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.78rem;color:var(--muted);margin-top:2px;align-items:center}
.area{display:inline-flex;align-items:center;gap:5px;color:var(--c)}
.tag{border:1px solid var(--line);border-radius:4px;padding:0 6px;font-size:.72rem}
.booth{font-family:var(--f-mono);font-weight:700;font-size:.86rem;letter-spacing:.02em;border:1.5px solid var(--c,var(--line));color:var(--c,var(--ink));border-radius:6px;padding:1px 8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.booth.none{border-style:dashed;color:var(--muted);border-color:var(--line);font-weight:500}
.desc{grid-column:2/4;margin:4px 0 0;font-size:.86rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.desc.open{-webkit-line-clamp:unset}
.links{grid-column:2/4;display:flex;flex-wrap:wrap;gap:12px;font-size:.8rem}
.links a{color:var(--accent)}
.kids{grid-column:2/4;margin:6px 0 0;padding:0;list-style:none;border-left:2px solid var(--line)}
.kids li{display:flex;gap:10px;align-items:center;padding:4px 0 4px 12px;font-size:.88rem}
.kids li.on{background:var(--accent-soft)}
.kids .ck{width:18px;height:18px;margin:0}
.kids label{flex:1;min-width:0;overflow-wrap:anywhere;cursor:pointer}
.kids .booth{font-size:.74rem}
.more{border:0;background:none;color:var(--accent);padding:0;cursor:pointer;font-size:.8rem}
.empty{padding:40px 0;text-align:center;color:var(--muted)}

/* 訪問プラン */
.halls{display:flex;flex-wrap:wrap;gap:6px;padding-block:16px 4px}
.halls a{text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:.82rem;font-variant-numeric:tabular-nums}
.halls a b{font-family:var(--f-mono)}
.hall{margin-top:20px}
.hall h2{font-family:var(--f-display);font-weight:700;font-size:1.15rem;margin:0 0 6px;display:flex;align-items:baseline;gap:10px}
.hall h2 small{font-family:var(--f-body);font-weight:400;font-size:.8rem;color:var(--muted)}
.pl{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.pl:first-of-type{border-top:1px solid var(--line)}
.pl.done{background:var(--done-soft)}
.pl.done .nm{text-decoration:line-through;text-decoration-color:var(--done);color:var(--muted)}
.pl .ck{accent-color:var(--done)}
.pl .nm{font-weight:700;overflow-wrap:anywhere;line-height:1.4}
.pl .nm small{display:block;font-weight:400;font-size:.75rem;color:var(--muted)}
.pl .memo{grid-column:3/5;width:100%;border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--surface);font-size:.84rem}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1.1rem;line-height:1;padding:4px 6px}
.x:hover{color:var(--warn)}

.tools{margin-top:32px;display:grid;gap:12px;border-top:1px solid var(--line);padding-top:20px}
.tools h3{margin:0;font-size:.95rem}
.tools p{margin:0;color:var(--muted);font-size:.82rem}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:8px;padding:7px 14px;cursor:pointer;font-size:.86rem}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.danger{background:var(--surface);color:var(--warn);border-color:var(--warn)}
textarea{width:100%;min-height:72px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface);font-family:var(--f-mono);font-size:.75rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:.85rem;z-index:20}
footer{margin-top:40px;color:var(--muted);font-size:.75rem}
footer a{color:inherit}
@media (max-width:480px){.ex{grid-template-columns:auto minmax(0,1fr)}.ex .booth-col{grid-column:2;justify-self:start}.desc,.links,.kids{grid-column:2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header>
  <div class="hd">
    <div class="brand">
      <h1>CEATEC 2026 訪問リスト</h1>
      <p>10.13–16 幕張メッセ　出展者 <span id="nEx"></span> 社／共同出展 <span id="nKid"></span> 社（公式一覧 2026-10-05 時点）</p>
    </div>
    <div class="tally"><span class="t-go"><b id="cGo">0</b>件 行く</span><span class="t-done"><b id="cDone">0</b>件 訪問済</span></div>
  </div>
  <div class="tabs" role="tablist">
    <button role="tab" id="tabPick" aria-selected="true">出展者を選ぶ</button>
    <button role="tab" id="tabPlan" aria-selected="false">訪問プラン</button>
  </div>
</header>

<main class="wrap">
  <section id="pick">
    <div class="controls">
      <input id="q" class="search" type="search" placeholder="社名・展示内容で検索（例：AI、センサ、電源）" autocomplete="off">
      <div class="row" id="areas"></div>
      <div class="row">
        <select id="hall" class="chip" aria-label="ホール"><option value="">全ホール</option></select>
        <select id="sort" class="chip" aria-label="並び順"><option value="name">社名順</option><option value="booth">ブース番号順</option></select>
        <button class="chip" id="fStudent" aria-pressed="false">学生フレンドリー</button>
        <button class="chip" id="fOn" aria-pressed="false">チェック済のみ</button>
        <span class="count" id="hit"></span>
      </div>
    </div>
    <div class="list" id="list"></div>
  </section>

  <section id="plan" hidden>
    <div class="halls" id="halls"></div>
    <div id="planBody"></div>
    <div class="tools">
      <div><h3>リストを書き出す</h3><p>ブース順のテキストをコピーします。メールやチャットに貼り付けて共有できます。</p></div>
      <div class="row"><button class="btn" id="copyText">テキストでコピー</button></div>
      <div><h3>別の端末に引き継ぐ</h3><p>チェックは このブラウザ内に保存されます。PC で選んでスマホで見るときは、コードをコピーして相手側の「読み込む」に貼り付けてください。</p></div>
      <textarea id="code" aria-label="引き継ぎコード" placeholder="ここに引き継ぎコードを貼り付け"></textarea>
      <div class="row">
        <button class="btn" id="copyCode">コードをコピー</button>
        <button class="btn ghost" id="loadCode">貼り付けたコードを読み込む</button>
        <span style="flex:1"></span>
        <button class="btn danger" id="clearAll">すべて解除</button>
        <button class="btn danger" id="clearYes" hidden>本当に解除する</button>
      </div>
    </div>
  </section>

  <footer>出展者データは <a href="https://www.ceatec.com/ja/exhibition/exhibitor-list.php" target="_blank" rel="noopener">CEATEC 公式 出展者一覧</a> から取得。ブース番号は変更される場合があります。</footer>
</main>
<div class="toast" id="toast" hidden></div>

<script>

"rb":308,"o":1},{"id":"67","n":"Ideascaleジャパン株式会社","a":"ネクストジェネレーションパーク","h":"Hall 4","b":"4H419","d":"","ini":"A-Z","rb":121,"o":0},{"id":"391","n":"株式会社iPX","a":"一般展示（General Exhibits）","h":"Hall 8","b":"8H208","d":"工場・倉庫の日々の改善から、自動化・省人化に向けた長期計画まで。現場の動きやシミュレーション結果を可視化し、定量評価に基づく意思決定を支援するソリューションを展示します。シミュレーション結果を3Dで可視化・共有できる「SimView」のほか、作業者の動線を可視化・分析する「EdgeFlow」など、今後リリース予定の新製品もご紹介します。","ini":"あ","rb":359,"o":1},{"id":"64","n":"株式会社OUTSENSE","a":"ネクストジェネレーションパーク","h":"Hall 4","b":"4H442","d":"様々な物理特性を制御した立体形状サンプルを複数展示予定。罫線部分の設計改善、環境負荷軽減、製造時の生産性向上など多種の機能をサンプルをご覧いただき、体感いただけます。","ini":"あ","rb":137,"o":1},{"id":"217","n":"青山学院大学 CMOS回路応用デバイス研究室(横式研究室)","a":"ネクストジェネレーションパーク","h":"Hall 4","b":"4H410","d":"小型や新型のエナジーハーベスタは、形状に自由度があったり、利用できる環境が増えていたりと魅力的ですが、得られる電力が小さい傾向があります。 本研究室では、そのエナジーハーベスタを活かすための研究を行っています。具体的には、小型キャパシタにエナジーハーベスタの電力を蓄電し、瞬間的に放電する間欠駆動型のデバイス、その応用先です。 この技術でエナジーハーベスタのみでセンシングや無線通信を行えます。","ini":"あ","rb":113,"o":1},{"id":"303","n":"株式会社AquaFusion","a":"一般展示（General Exhibits）","h":"Hall 8","b":"8H115","d":"","ini":"あ","rb":337,"o":0},{"id":"295","n":"株式会社Axworks","a":"ネクストジェネレーションパーク","h":"Hall 4","b":"4H237","d":"【映像をアップロードするだけで、多言語字幕映像をかんたん生成】 ・30言語以上への翻訳に対応する、日本語に特化した映像翻訳サービス ・ブラウザ上で字幕を確認・かんたん修正 ・字幕付き映像で出力可能（SRT・CSVでの出力も対応）","ini":"あ","rb":68,"o":1},{"id":"1292","n":"株式会社アクティブリテック","a":"X（Transformation）パーク","h":"Hall 6","b":"6H133","d":"現場を歩くだけで3Dデータ化できるXGRIDSの最新3Dスキャナーを展示します。建設・土木、設備点検、測量、インフラ維持管理などの現場で、写真やメモだけでは残しきれない空間情報を点群データとして記録・共有。さらに、3DGS（3D Gaussian Splatting）による高精細でリアルな3D空間表現により、現場確認や関係者間の共有をより直感的に行えます。","ini":"あ","rb":214,"o":1,"st":1,"t":["学生フレンドリー"]},{"id":"395","n":"Acoustic Professor Tech Co., Ltd","a":"一般展示（General Exhibits）","h":"Hall 7","b":"7H321","d":"ACP（ACOUSTIC PROFESSOR TECHNOLOGY）は、次世代モビリティおよびAI機器向けに先進的な音響ソリューションを提供する、プロフェッショナルなスピーカーメーカーです。 車載空間に最適な高音質カーオーディオ、スマート家電やAIデバイスに欠かせない超小型スピーカーユニット、お客様の高度な要求に応える「完全音響カスタムソリューション」の最新ラインアップを実機でご紹介します。","ini":"A-Z","rb":261,"o":1},{"id":"82","n":"agile effect","a":"ネクストジェネレーションパーク","h":"Hall 4"," 未来の中古車購入を体験してください。","ini":"あ","rb":160,"o":1,"k":[{"n":"株式会社Otoz.Ai Japan"}]},{"id":"55","n":"今永電機産業株式会社/ENG Electric Co., Ltd.","a":"一般展示（General Exhibits）","h":"Hall 7","b":"7H323","d":"今永電機産業とENG Electronics(イエヌジー)は初の合同出展をいたします。本展では、今永電機産業が誇る「豊富な在庫量と電子部品の企画提案力」に、イエヌジーの「電源技術」を融合。両社の強みを結集し、次世代社会を支える電源ソリューションを創出します。日本の商社力とグローバルな開発技術が織りなす、まだ見ぬ次世代の可能性をぜひ会場でご体感ください。","ini":"あ","rb":263,"o":1},{"id":"307","n":"学校法人岩崎学園 情報科学専門学校","a":"ネクストジェネレーションパーク","h":"Hall 4","b":"4H126","d":"1983年に開校以来、情報科学専門学校はIT専門学校のトップランナーとして、多くのスペシャリストを育成してきました。 中でも3・4年生は自分の関心に合うゼミを選び、好きなテーマを設定して制作・研究を進めます。 当日は本校の学びの集大成となるゼミ活動での制作物や研究内容を、ご来場者の皆様にも体感していただけるブースをご用意しております。ぜひ足を運んでください。","ini":"あ","rb":19,"o":1,"st":1,"t":["学生フレンドリー"]},{"id":"251","n":"公立大学法人岩手県立大学","a":"ネクストジェネレーションパーク","h":"Hall 4","b":"4H001-006","d":"岩手県立大学は、キャンパスに隣接する滝沢市IPUイノベーションセンター/パークに立地する企業を、大学の学部・研究科と同等の「企業学群」として位置づけ、大学と企業の相互依存関係を促進する新たな産学官連携のモデル構築を目指し、共同研究、技術開発、人材育成など多様な連携活動を展開しています。 今回の展示では、そこで進行しているいくつかの共同研究プロジェクトを紹介します。","ini":"あ","rb":0,"o":1,"k":[{"n":"Defios株式会社"},{"n":"NPOイノベブリッジたきざわ","id":"902"},{"n":"NPOイーハトーブ地域情報マネジメント"},{"n":"岩手県滝沢市","id":"901"},{"n":"株式会社ぴーぷる"},{"n":"株式会社サステナ","id":"903"},{"n":"株式会社復建技術コンサルタント"},{"n":"滝沢ロボティクス合同会社","id":"905"}]},{"id":"318","n":"インターバース社会実装推進メタコンソーシアム（産業技術総合研究所）、人間拡張コンソーシアム（NTTドコモ）","a":"X（Transformation）パーク","h":"Hall 6","b":"6H242","d":"現実世界とバーチャル世界がつながり融合する未来の社会「インターバース」、人の身体能力・知覚・体験を拡げる「人間拡張」。 「インターバース社会実装推進メタコンソーシアム」と「人間拡張コンソーシアム」が最新技術や研究成果を共同展示し、デモンストレーションを通じて、人々の暮らしや働き方がどのように変わるのか、そして未来社会の実現に向けてどのような研究開発が進められているのかをご紹介します。","ini":"あ","rb":225,"o":1,"st":1,"t":["学生フレンドリー"],"k":[{"n":"国立研究開発法人産業技術総合研究所"},{"n":"株式会社NTTドコモ"}]},{"id":"72","n":"inMirrors株式会社","a":"一般展示（General Exhibits）","h":"Hall 7","b":"7H412","d":"「見る」を拡張し、産業を動かす。 inMirrorsは、装着するAIインターフェース＝業務用スマートグラスを軸に、現場実装まで一気通貫で提供するデバイスソリューション企業です。物流・保全・医療など各産業ごとにカスタム開発したスマートグラスを実機展示。AI画像認識を応用したテニスロボット「ACEMATE」もあわせて体感いただけます。","ini":"A-Z","rb":285,"o":1},{"id":"169","n":"VMFi Inc","a":"ネクストジェネレーションパーク","h":"Hall 4","b":"  4","b":"4H437","d":"","ini":"あ","rb":135,"o":0},{"id":"24","n":"NEC","a":"一般展示（General Exhibits）","h":"Hall 8","b":"8H230","d":"","ini":"A-Z","rb":373,"o":1},{"id":"31","n":"NECパーソナルコンピュータ株式会社","a":"一般展示（General Exhibits）","h":"Hall 7","b":"7H004","d":"法人向けPCブランド「LAVIE」の最新AI PCラインアップと、生成AI活用時の個人情報漏洩リスクを低減する独自技術「PS Info Shield」を展示します。世界最長バッテリー駆動のCopilot+ PCやローカルAIによる個人情報匿名化技術、AI活用ソリューションを通じて、企業のDXと価値創出を加速する安全で実践的な次世代ワークプレイスをご紹介します。","ini":"A-Z","rb":231,"o":1},{"id":"47","n":"一般財団法人NHK財団","a":"一般展示（General Exhibits）","h":"Hall 8","b":"8H318","d":"NHKの技術シーズの中から、伸ばしたり折り畳んだりしても映像を表示できる「ディフォーマブルディスプレー技術」を実機にてご紹介します。自由な形状を実現するディスプレー基盤技術と、液体金属による伸縮配線を用いた回路形成技術を組み合わせて実現しました。会場では実機展示に加え、「白黒映像のカラー化技術」もご紹介します。ぜひお気軽にお立ち寄りください。","ini":"あ","rb":384,"o":1,"st":1,"t":["学生フレンドリー"]},{"id":"257","n":"NJCネットコミュニケーションズ株式会社","a":"ネクストジェネレーションパーク","h":"Hall 4","b":"4H319","d":"","ini":"A-Z","rb":89,"o":0},{"id":"269","n":"愛媛県","a":"一般展示（General Exhibits）","h":"Hall 7","b":"7H203","d":"愛媛県は、製造、海事、農林水産、観光など、多様な産業をフィールドに、デジタル技術を活用した実証・実装を推進しています。ブースでは、県内企業とスタートアップ等が取り組む実装事例や、愛媛県での事業展開・拠点設置につながる支援をご紹介。愛媛県での新たなビジネス展開に向けたご相談をお待ちしています。","ini":"あ","rb":242,"o":1},{"id":"1179","n":"株式会社FSMC","a":"ネクストジェネレーションパーク","h":"Hall 4","b":"4H335","d":"FSMCは、2023年設立の半導体開発・製造スタートアップです。少量多品種のカスタムICを誰もが利用できる世界をめざし、「LDIC」という設計・製造アーキテクチャを開発しています。従来は開発費約2億円、開発期間1年かかっていたカスタムIC開発を、LDICは開発コスト100分の1以下、期間最短1週間に短縮します。対象は医療機器、航空宇宙、ロボットなど、少量でも高性能・長期供給が求められる分野です。","ini":"あ","rb":102,"o":1,"st":1,"t":["💬 ブース対応可能言語：英語","学生フレンドリー"]},{"id":"305","n":"株式会社EVORIX","a":"一般展示（General Exhibits）","h":"Hall 5","b":"5H431","d":"","ini":"あ","rb":196,"o":0},{"id":"374","n":"MK CO.,LTD","a":"一般展示（General Exhibits）","h":"Hall 8","b":"8H217","d":"","ini":"A-Z","rb":367,"o":0},{"id":"94","n":"エルアップシステム株式会社","a":"ネクストジェネレーションパーク","h":"Hall 4","b":"4H155","d":"","ini":"あ","rb":44,"o":0},{"id":"86","n":"一般社団法人 LBMA Japan","a":"X（Transformation）パーク","h":"Hall 6","b":"6H121","d":"LBMA Japan団体出展では、「位置情報データ Transformation」をテーマに、位置情報をマーケティングだけでなく、都市・交通・観光・防災など社会インフラとして活用する最先端事例を紹介します。15社による共同出展に加え、終日開催のカンファレンス、2026年版カオスマップの発表、総合案内所による来場者とのマッチングなど、業界を超えた共創と新たなビジネス創出の場として展開します。","ini":"あ","rb":212,"o":1,"st":1,"t":["学生フレンドリー"],"k":[{"n":"はつかぜ株式会社","id":"866"},{"n":"ジオテクノロジーズ株式会社"},{"n":"ソフトバンク株式会社"},{"n":"トムトム・セールス・B.V."},{"n":"マルティスープ株式会社"},{"n":"国際航業株式会社"},{"n":"日野コンピューターシステム株式会社","id":"869"},{"n":"株式会社Ashirase","id":"872"},{"n":"株式会社IoTBank"},{"n":"株式会社unerry"},{"n":"株式会社ゼンリン"},{"n":"株式会社ゼンリンデータコム"},{"n":"株式会社データインサイト"},{"n":"株式会社プライバシーテック","id":"862"},{"n":"株式会社マップル"},{"n":"横浜市立大学"}]},{"id":"368","n":"株式会社EmbodyMe","a":"一般展示（General Exhibits）","h":"Hall 7","b":"7H515","d":"独自の映像/音声生成AIモデル基盤を研究開発するスタートアップです。 NVIDIAやMicrosoftから技術表彰をもらっている高い技術力で作る、リアルタイム生成によるリアルなAIアバターとの会話をブースで体験いただきたいです。","ini":"あ","rb":313,"o":1},{"id":"68","n":"大阪産業大学","a":"ネクストジェネレーションパーク","h":"Hall 4","b":"4H116","d":"小型マイコンの限られた計算資源を活用し、回転体の異常を捉える組込みAI技術を紹介します。 高精度な周波数補間と強化学習を組み合わせて異常を検知する仕組みと、教育・研究への展開をご覧いただけます。","ini":"あ","rb":12,"o":1,"st":1,"t":["学生フレンドリー"]},{"id":"331","n":"大阪大学社会技術共創研究センター","a":"ネクストジェネレーションパーク","h":"Hall 4","b":"4H304","d":"新規技術を社会実装するとき、技術的な性能や法令への適合だけでは決められない問いが必ず生まれます。誰にどのような影響が及ぶのか、その扱いは受け入れられるのか、説明責任をどう果たすか。こうした問いを一括して扱う枠組みがELSI（倫理的・法的・社会的課題）です。本ブースでは、大阪大学ELSIセンターが企業とともに取り組んできたさまざまな研究を、データビジネス、顔認証、量子技術といった領域から紹介します。","ini":"あ","rb":79,"o":1,"st":1,"t":["学生フレンドリー"]},{"id":"222","n":"大阪大学 モバイルコンピューティング講座（山口研究室）","a":"ネクストジェネレーションパーク","h":"Hall 4","b":"4H301-303","d":"JST CRESTの支援を受けて研究開発を進めるAI避難誘導システム「しるべAI」を展示します。読売テレビが開発するテレビ向けAIエージェントとの連携により、一人ひとりに寄り添う安全・安心な災害時対応の最新技術を紹介します。さらに、スマート農業や衛星・次世代通信を活用した宇宙システムも展示し、山口研究室が推進するサイバーフィジカルシステム研究の未来を体感いただけます。","ini":"あ","rb":78,"o":1,"st":1,"t":["学生フレンドリー"]},{"id":"328","n":"大阪府/大阪市","a":"X（Transformation）パーク","h":"Hall 6","b":"6H238","d":"","ini":"あ","rb":224,"o":0},{"id":"74","n":"株式会社オービックビジネスコンサルタント","a":"一般展示（General Exhibits）","h":"Hall 8","b":"8H133","d":"奉行クラウドは、会計・人事労務・請求書管理などのバックオフィス業務を統合し、企業のDXを支援するクラウドサービスです。AIが仕訳作成や異常値チェック、社員検索などを支援し、業務の効率化とミス削減を実現。さらに、SOC1・SOC2やISMAPなどの厳格なセキュリティ基準に対応し、安心してAIを活用できる環境を提供します。","ini":"あ","rb":354,"o":1},{"id":"381","n":"株式会社openpage","a":"一般展示（General Exhibits）","h":"Hall 7","b":"7H408","d":"商談の“型”をつくり成果につなげるDXツール — 顧客ごとの専用ページで検討・進捗を可視化 ■ openpageとは 相手企業ごとに独立した専用ページを発行し、面談記録・提案資料・次回アクションを1ページに集約するデジタルセールスルームです。 相手はURLをクリックするだけで閲覧でき、アカウント登録もアプリ導入も不要。低いハードルで、商談後もつながり続ける“接点の置き場所”をつくります。","ini":"あ","rb":281,"o":1},{"id":"330","n":"沖縄県","a":"X（Transformation）パーク","h":"Hall 6","b":"6H008","d":"沖縄は、空路4時間圏内に人口約22億人の巨大マーケットを抱える「アジアと日本を繋ぐビジネスHUB」。那覇空港・那覇港を核とした国際物流網、日本一若く活気ある人材、独立した電力供給体制、本土との同時被災リスクの低さ、国内随一の税制優遇制度など、企業立地に理想的な環境が整っています。平均年齢・Uターン者割合・開業率は全国1位。「経済特区沖縄」として、貴社の新たな事業展開をサポートします。","ini":"あ","rb":204,"o":1,"k":[{"n":"名護市"},{"n":"宜野座村"}]},{"id":"98","n":"株式会社オスティアリーズ","a":"一般展示（General Exhibits）","h":"Hall 7","b":"7H201","d":"","ini":"あ","rb":240,"o":0},{"id":"324","n":"株式会社オプテージ","a":"一般展示（General Exhibits）","h":"Hall 8","b":"8H316","d":"コネクティビティとAI活用に特化した「曽根崎データセンター（OC1）」、アプリからインフラまでをワンストップ提供する「OPTAGE Private AI」、GPUサーバ設置環境となる「コンテナ型AIデータセンター」をご紹介。 さらに、東名阪の主要データセンターをつなぐ高信頼・高帯域サービス「AOC（All-Optical Connect）」も加え、通信・データセンター・AI活用もご覧いただけます。","ini":"あ","rb":382,"o":1},{"id":"396","n":"株式会社カイボオーディオ","a":"一般展示（General Exhibits）","h":"Hall 7","b":"7H208","d":"","ini":"か","rb":247,"o":0},{"id":"275","n":"海洋デジタル社会パビリオン","a":"X（Transformation）パーク","h":"Hall 5","b":"5H210","d":"海は、日本に残された最後のフロンティア。豊かな漁場がある一方、担い手は減り続けています。その現場を「開かれた挑戦の場」に変えるべく16社/団体が集結し、デジタルで変わる漁業・養殖・海洋観測の\"いま\"を発信。さらに高校生・高専生・大学生が海の未来を提言する「Blue-Shrimp Summit.2026」が始動します。技術と次世代のまなざしが交わる場から、海洋産業の次の10年へ。","ini":"か","rb":174,"o":1,"st":1,"t":["学生フレンドリー"],"k":[{"n":"ALANコンソーシアム","id":"1235"},{"n":"Nōka.AI"},{"n":"一般社団法人日本水中ドローン協会"},{"n":"一般財団法人マリンオープンイノベーション機構/静岡市","id":"975"},{"n":"国立研究開発法人新エネルギー・産業技術総合開発機構（NEDO）"},{"n":"国立研究開発法人海洋研究開発機構（JAMSTEC）","id":"969"},{"n":"富士通株式会社 海洋デジタルツイン"},{"n":"株式会社UMIAILE","id":"1258"},{"n":"株式会社アイエスイー","id":"968"},{"n":"株式会社アートチューンズ"},{"n":"株式会社スペースワン"},{"n":"株式会社ポテンシャライト"},{"n":"株式会社ロボティクスセーリングラボ"}]},{"id":"1 ","a":"一般展示（General Exhibits）","h":"Hall 7","b":"7H332","d":"毎年１月に米国ラスベガスで開催され、60年近い歴史を持つ世界最大のテック展示会「CES」。 日本パビリオン「JAPAN TECH」の企画を行う株式会社クリエイティヴ・ヴィジョンは、コンファレンスでスペシャルトークセッションを開催します。 ■セッション：ES-152 10月15日（木）11:30 JAPAN TECH出展者に聞く 世界最大の展示会CESの使い方～裏から聞く海外展示会の出展事情～","ini":"か","rb":272,"o":1,"t":["💬 ブース対応可能言語：英語"]},{"id":"321","n":"グローバル・デジタル・イノベーション・ネットワーク","a":"一般展示（General Exhibits）","h":"Hall 7","b":"7H214","d":"Global Digital Innovation Network(GDIN) は、大韓民国科学技術情報通信部(MSIT)傘下に設立された非営利財団です。 広範な起業家ネットワーク、グローバル市場への対応力、そして専門的なインハウス知見を活かし、韓国の最も有望なテック・スタートアップに対して包括的なグローバルソリューションを提供しています。","ini":"か","rb":250,"o":1,"t":["💬 ブース対応可能言語：英語・韓国語"],"k":[{"n":"AM Management CORP.","b":"7H214-08","id":"1231"},{"n":"BUPTLE","b":"7H214-07","id":"1229"},{"n":"DeepSearch, Inc.","b":"7H214-01"},{"n":"IPIN LABS Co., LTD","b":"7H214-02","id":"1228"},{"n":"Korea Body Information Co., Ltd.","b":"7H214-05"},{"n":"Neurofusion Inc.","b":"7H214-06","id":"1227"},{"n":"Sendbird, Inc.","b":"7H214-03","id":"1226"},{"n":"VCAT AI","b":"7H214-04","id":"1224"}]},{"id":"146","n":"群馬県沼田市","a":"一般展示（General Exhibits）","h":"Hall 8","b":"8H212","d":"群馬県北部に位置する「沼田市」において、企業様が求める立地環境をご提案いたします。 事業用地等のご紹介を通じて事業展開・拠点整備をご支援し、企業活動と地域産業の発展を目指します。","ini":"か","rb":362,"o":1},{"id":"220","n":"恵安株式会社","a":"X（Transformation）パーク","h":"Hall 5","b":"5H117","d":"4大トレンドが変える、世界の未来構図 AI · Cloud · Cybersecurity · ESG —— 世界を再定義する AI活用の本格普及 クラウド算力のサブスクリプション化 データセキュリティ危機 ESG持続可能性の義務化 「アトムチャネル」×「ビット算力」を融合――物理ハードウェアを、感知・理解・意思決定能力を持つAIエンドポイントへ昇華させる","ini":"か","rb":162,"o":1},{"id":"160","n":"慶應義塾大学 ハプティクス研究センター","a":"ネクストジェネレーションパーク","h":"Hall 4","b":"4H009-012","d":"","ini":"か","rb":2,"o":1,"st":1,"t":["学生フレンドリー"],"k":[{"n":"モーションリブ株式会社"}]},{"id":"195","n":"株式会社原石","a":"ネクストジェネレーションパーク","h":"Hall 4","b":"4H336","d":"大企業R&D部門に埋没する技術シーズ（＝\"原石\"）を、生成AIで発掘。 ブースでは『GEN-SEKI Lab』の実機デモをご体験いただけます！ 技術レポートや特許を読み込ませるだけで、用途探索・技術レビュー・技術棚卸などのアウトプットが生成される様子をその場でご覧ください。 R&D・技術企画・知財部門の方は必見です。","ini":"か","rb":103,"o":1},{"id":"154","n":"株式会社コア","a":"X（Transformation）パーク","h":"Hall 5","b":"5H411","d":"","ini":"か","rb":191,"o":0},{"id":"53","n":"一般財団法人 工業所有権協力センター","a":"一般展示（General Exhibits）","h":"Hall 8","b":"8H026","d":"新しい技術やサービスの開発を進める際、「すでに同じような技術が特許になっていないか」「事業を進める上で注意すべき特許はないか」といった確認は欠かせません。IPCCは特許庁登録調査機関として培った知見と400万件超の調査実績を生かし、特許調査サービスを通じて企業の研究開発や知財活動をサポートしています。ブースでは先行技術調査を中心としたIPCC調査サービスや、特許情報活用のポイントをご紹介します。","ini":"か","rb":328,"o":1},{"id":"209","n":"航天科技半導体有限公司/志豪微電子（恵州）有限公司","a":"一般展示（General Exhibits）","h":"Hall 7","b":"7H329","d":"","ini":"か","rb":269,"o":1},{"id":"25","n":"コーデンシ株式会社","a":"一般展示（General Exhibits）","h":"Hall 8","b":"8H411","d":"\"サウンドモバイルビジョン\" 災害時の避難誘導や注意喚起をはじめ、コンサート・イベント案内、工事現場の迂回路案内など、幅広い用途に対応する移動型フルカラーLEDディスプレイです。高輝度LEDにより屋外でも高い視認性を確保し、動画・静止画の表示に加え、スピーカー、マイク、サイレン等の音声機能も搭載。視覚と聴覚の両面から情報を伝達し、軽量・コンパクト設計で、電源のない場所でも活用できます。","ini":"か","rb":390,"o":1,"st":1,"t":["💬 ブース対応可能言語：英語","学生フレンドリー"]},{"id":"38","n":"コーンズテクノロジー株式会社","a":"一般展示（General Exhibits）","h":"Hall 5","b":"5H130","d":"次世代の「電源」と「インターフェース」を支える先端技術を展示。最大1.5mの空間へ給電可能なワイヤレス給電、室内光発電素子、バイオフィルム電池など、配線・電池交換の負担を減らすサステナブルな電源技術をご紹介します。さらに、高感度ひずみセンサ、裸眼3Dなど、視覚・触覚を融合した次世代インターフェースを体感いただけます。","ini":"か","rb":166,"o":1},{"id":"104","n":"国立情報学研究所/京都大学/情報セキュリティ大学院大学/東京情報デザイン専門職大学 「ZT-IoTプロジェクト」","a":"ネクストジェネレーションパーク","h":"Hall 4","b":"4H207","d":"","ini":"か","rb":47,"o":0,"k":[{"n":"CREST ZT-IoT"}]},{"id":"43","n":"株式会社コシブ精密","a":"一般展示（General Exhibits）","h":"Hall 7","b":"7H325","d":"高精度レーザー描画装置により高精度・安価なフォトマスク(2D)製作は基より、グレースケールマスク(3D)も対応可能となります。 その他各種エンコーダスリット板、スタンダードスケール、ガラス目盛板等、少量からの製作対応も可能です。 お客様のニーズにお答え致します。","ini":"か","rb":265,"o":1,"t":["💬 ブース対応可能言語：英語"]},{"id":"131","n":"株式会社コスモサウンド","a":"一般展示（General Exhibits）","h":"Hall 8","b":"8H216","d":"","ini":"か","rb":366,"o":0},{"id":"75","n":"Kotozna株式会社","a":"X（Transformation）パーク","h":"Hall 5","b":"5H112","d":"","ini":"A-Z","rb":157,"o":1},{"id":"165","n":"common株式会社","a":"ネクストジェネレーションパーク","h":"Hall 4","b":"4H333","d":"","ini":"A-Z","rb":100,"o":0},{"id":"175","n":"株式会社CoLabMix","a":"ネクストジェネレーションパーク", :"Hall 8","b":"8H215","d":"ディスプレイメーカーである弊社サンテクノロジー(サンテック)が開発した電子ペーパー製品「EZ Sign」を展示します。NFCを利用して表示を書き換える、電池や電源配線が不要な完全無電源の表示デバイスです。電源・通信環境に縛られず、手軽に設置・更新できる新しい表示ソリューションです。スマートフォンやPCを使った書き換えデモを実施するほか、「新モデル・新機能」の発表も行います。","ini":"さ","rb":365,"o":1},{"id":"49","n":"株式会社３４６","a":"一般展示（General Exhibits）","h":"Hall 7","b":"7H510","d":"プロダクトデザインと設計力を軸に、ハードウェア製品の企画から量産までを一気通貫でサポートする開発支援サービス（ODM）を提供しています。 支援内容として、製品デザイン、設計製造、PoC支援、プロトタイプ、新規事業開発、ブランド構築等、お客様ニーズに応じた幅広い支援が可能です。 また業界について、産業用ロボット、モビリティ、医療・ヘルスケア機器、飲料機器など、多様な業界での支援実績を有しています。","ini":"さ","rb":309,"o":1,"st":1,"t":["💬 ブース対応可能言語：英語","学生フレンドリー"]},{"id":"264","n":"CIAJオール光ネットワークパビリオン","a":"一般展示（General Exhibits）","h":"Hall 8","b":"8H101","d":"オール光ネットワークは、低消費電力・超高速・低遅延など、未来を支える通信です。 「CIAJオール光ネットワークパビリオン」では、オール光ネットワークの社会実装に向けた総務省の施策の紹介、CIAJ会員各社による関連製品・サービスを展示します。 【出展者】総務省、アンリツ、APRESIA Systems、NTT、大井電気、三球電機製作所、日本航空電子工業、日本電気、横河計測、1Finity、CIAJ","ini":"A-Z","rb":331,"o":1,"k":[{"n":"1FINITY株式会社"},{"n":"APRESIA Systems株式会社"},{"n":"NTT株式会社"},{"n":"アンリツ株式会社"},{"n":"一般社団法人 情報通信ネットワーク産業協会（CIAJ)"},{"n":"大井電気株式会社"},{"n":"日本航空電子工業株式会社"},{"n":"日本電気株式会社"},{"n":"株式会社三球電機製作所"},{"n":"横河計測株式会社"},{"n":"総務省"}]},{"id":"279","n":"CIAJ ＆ HATSフォーラム","a":"一般展示（General Exhibits）","h":"Hall 7","b":"7H301","d":"HATSフォーラムは、1988年に総務省（当時郵政省）により発足し、一般社団法人 情報通信ネットワーク産業協会（CIAJ）が事務局を担っています。 異なる通信機器メーカーの製品が規格どおり接続できることを確認し、安心して通信系製品を利用いただけるよう活動しており、これまでに累計1,600機種を超える製品の接続性を確認してきました。 ブースでは、さまざまな通信機器を使ったデモを体験いただけます。","ini":"A-Z","rb":252,"o":1,"st":1,"t":["学生フレンドリー"],"k":[{"n":"CIAJユーザネットワークシステム委員会"},{"n":"CIAJ画像情報ファクシミリ委員会"},{"n":"CIAJ通信品質委員会"},{"n":"HATSフォーラム"},{"n":"NECプラットフォームズ株式会社"},{"n":"一般社団法人情報通信ネットワーク産業協会"},{"n":"一般社団法人情報通信技術委員会（TTC)"},{"n":"株式会社日立情報通信エンジニアリング"},{"n":"沖電気工業株式会社"}]},{"id":"135","n":"株式会社Ｃ＆Ｔ","a":"一般展示（General Exhibits）","h":"Hall 7","b":"7H414","d":"","ini":"さ","rb":287,"o":0},{"id":"58","n":"株式会社 CMF Design Lab","a":"一般展示（General Exhibits）","h":"Hall 7","b":"7H123","d":"製品の「見た目」「質感」「触感」といった感性的価値を設計し、単なるスタイリングではなく、素材や加工方法まで踏み込んだ提案で、プロダクトに新たな魅力を加え、消費者に選ばれ続けるブランディングと売上拡大を実現します。精度や信頼性が求められる製品において、「商品の魅力」「使いやすさ」「清潔感」「安心感」などの視覚・触覚的品質を向上させるデザインアプローチを多くの企業様からご相談いただいております。","ini":"さ","rb":239,"o":1},{"id":"140","n":"GC-PF株式会社","a":"ネクストジェネレーションパーク","h":"Hall 4","b":"4H135","d":"「見える」と、EVインフラはもっと分かりやすくなる。「1500Wで何が動く？」「充電器は正常に動いている？」をその場で見える化。挿すだけ・見るだけで使える診断機器に加え、充電設備のレイアウトや概算工事費を誰でも簡単に作成できる「DXレイアウト」もご紹介します。見て、触れて、すぐに価値を実感できる展示です。","ini":"A-Z","rb":26,"o":1},{"id":"379","n":"JCOM株式会社","a":"ネクストジェネレーションパーク","h":"Hall 4","b":"4H226","d":"J:COMは2026年4月にR＆Dセンターを設立しました。 今回、次世代無線通信規格「Wi-Fi 8」の検証成果と、AIを活用した次世代ネットワーク運用の研究開発成果を展示します。 ブースでは、Wi-Fi 6・7・8との通信比較や、AIエージェントがネットワークにおける障害を検知し、原因分析から復旧までを自律的に実行する一連の流れを再現したデモンストレーション映像を公開します。","ini":"A-Z","rb":60,"o":1,"st":1,"t":["学生フレンドリー"]},{"id":"142","n":"株式会社JCCL","a":"ネクストジェネレーションパーク","h":"Hall 4","b":"4H020","d":"当社は2020年に設立された九州大学発のスタートアップで、「日本発のCO₂回収技術で世界のカーボンニュートラルを実現する」をミッションに掲げ、低コストかつ高効率な省エネ型CO₂回収技術の開発・実用化に取り組んでいます。 当社ブースでは、省エネ型のCO₂回収技術とそのソリューションについてご紹介いたしますので、ぜひお越しください。","ini":"さ","rb":7,"o":1},{"id":"314","n":"JEITA半導体フォーラム2026","a":"X（Transformation）パーク","h":"Hall 6","b":"6H002","d":"日本を代表する半導体企業9社がブースを展開。 半導体が貢献する社会課題を解決、未来社会の実現につながるテクノロジーを紹介。","ini":"A-Z","rb":202,"o":1,"st":1,"t":["学生フレンドリー"],"k":[{"n":"JEITA 半導体部会"},{"n":"キオクシア株式会社"},{"n":"サンケン電気株式会社"},{"n":"ソニーセミコンダクタソリューションズ株式会社"},{"n":"ヌヴォトン テクノロジージャパン株式会社"},{"n":"マイクロンメモリ ジャパン株式会社"},{"n":"ルネサス エレクトロニクス株式会社"},{"n":"ローム株式会社"},{"n":"三菱電機株式会社"},{"n":"東芝デバイス＆ストレージ株式会社"}]},{"id":"284","n":"株式会社JTB","a":"X（Transformation）パーク","h":"Hall 6","b":"6H010","d":"","ini":"さ","rb":205,"o":0,"st":1,"t":["学生フレンドリー"]},{"id":"351","n":"株式会社シフト","a":"一般展示（General Exhibits）","h":"Hall 7","b":"7H419","d":"「その場・その時だけ」の安全なWebアクセスを実現する認証デバイス「QRtoken®」を展示。 一定時間で無効になるワンタイムQRとNFCを組み合わせ、コピーやSNS共有による不正利用を防ぎます。 専用アプリ不要で、QRを撮影するかスマートフォンをタッチするだけ。 CEATEC会場では実機を使って、その仕組みと新しい活用方法をご体験いただけます。","ini":"さ","rb":291,"o":1},{"id":"41","n":"シャープ株式会社","a":"一般展示（General Exhibits）","h":"Hall 5","b":"5H340","d":"シャープは、110年以上にわたり、エレクトロニクスを中心に、多くの世界初・業界初の革新的な製品や技術を開発してきました。経営信条「二意専心 誠意と創意」に基づき、コーポレートスローガン「ひとの願いの、半歩先。」を定め、人々の「暮らす」と「働く」のあらゆるシーンに寄り添う独創的なモノやサービスを通じ、「新しい文化」を創造する企業を目指しています。","ini":"さ","rb":187,"o":1,"st":1,"t":["学生フレンドリー"]},{"id":"215","n":"JiangXi GuiDe Technology Co. Ltd.","a":"一般展示（General Exhibits）","h":"Hall 7","b":"7H327","d":"江西貴徳科術有限会社は2021年2月8日に設立され、湖南貴徳グループに属し、工場面積は6.6万平方メートル、LCD、TFT/LCM、TPなどの製品の設計、生産、販売を専門としています。 会社は萍郷経済技術開発区新エネルギー材料産業基地に位置し、工場総面積は66,000平方メートル、クリーンルームは40,000平方メートルに達しています。","ini":"A-Z","rb":267,"o":1,"st":1,"t":["学生フレンドリー"]},{"id":"286","n":"Jiangxi Xingtai Technology Inc.","a":"一般展示（General Exhibits）","h":"Hall 7","b":"7H433","d":"","ini":"A-Z","rb":298,"o":1,"k":[{"n":"SHENZHEN MINEW TECHNOLOGIES CO., LTD."}]},{"id":"229","n":"Shanghai Super Vibe Technology Co., Ltd.","a":"ネクストジェネレーションパーク","h":"Hall 4","b":"4H228","d":"Souviの実機を実際に装着し、ハンズフリーで記録する体験をお試しいただけます。現在開発中のプロトタイプのため、展示内容・仕様・デザインは今後変更となる場合があります。","ini":"A-Z","rb":61,"o":1},{"id":"268","n":"ジュウガツ（上海）テクニカルサービス有限公司","a":"X（Transformation）パーク","h":"Hall 5","b":"5H113","d":"市場・業界分析、消費者インサイト、ECデータ分析を一つのプラットフォームに統合した「MERITCO AI」をご紹介します。自然言語で調査テーマを入力するだけで、情報検索、データ分析、論点整理からレポート作成までを支援。中国市場分析に強みを持つAIリサーチソリューションを、会場で実際にご体験いただけます。","ini":"さ","rb":158,"o":1,"st":1,"t":["学生フレンドリー"]},{"id":"63","n":"紹興欧柏斯光電科技有限公司","a":"一般展示（General Exhibits）","h":"Hall 7","b":"7H204","d":"当社は2002年に紹興工場を設立し、これまでLED樹脂封止技術の研究開発と応用に專念し、世界中のお客様に革新的なLED封止技術ソリューションの提供に力を入れています。7seg display/SMD、LED Lamp、PLCC及びCHIP LED製品を主軸として、それに付随するカスタム製品についても柔軟に対応し、自社設計、製品開発、生産、販売のワンストップサ-ビスを提供しています。","ini":"さ","rb":243,"o":1},{"id":"290","n":"常総市 AIまちづくりコンソーシアム","a":"X（Transformation）パーク","h":"Hall 6","b":"6H237","d":"","ini":"さ","rb":223,"o":0,"st":1,"t":["学生フレンドリー"],"k":[{"n":"Wing-AI Lab"},{"n":"常総市"},{"n":"株式会社ima"},{"n":"株式会社本田技術研究所"}]},{"id":"272","n":"湘南工科大学","a":"ネクストジェネレーションパーク","h":"Hall 4","b":"4H013-016","d":"トピックス： 量子・ひずみセンシング・足趾把持力トレアプリ・誤り訂正符号; ・3 量子ビットのもつれを用いた量子テレポーテーション 技術 ・人や植物の極微小変位を可視化する超高感度ひずみセンシング技術 ・足趾把持力トレーニングのアプリケーション ・誤り訂正符号上の物理学・幾何学・解析 以上の４つのトピックスについて紹介させて頂きます．","ini":"さ","rb":3,"o":1,"st":1,"t":["学生フレンドリー"]},{"id":"248","n":"一般社団法人 情報処理学会","a":"一般展示（General Exhibits）","h":"Hall 7","b":"7H405","d":"情報処理学会は、1960年に設立し、現在は一般社団法人として、 健全な情報化社会の実現を目指して活動しています。 主な事業は、情報処理分野における 機関誌の発行、大会・シンポジウム・セミナー・研究発表会の開催などです。","ini":"さ","rb":278,"o":1},{"id":"263","n":"独立行政法人情報処理推進機構","a":"X（Transformation）パーク","h":"Hall 6","b":"6H111","d":"デジタルを前提に、その先にある社会のあり方を構想し、多様な視点をつなぎ、社会基盤を共に設計し、実装することが、IPAの担うべき役割です。その働きを「PROTOCOL ENGINE」と名付け、今年の展示テーマとしました。参加型インスタレーションを通じて、これからの社会の仕組みをみなさんとともに考え、来場者のみなさまにそのコンセプトを体感していただきます。","ini":"さ","rb":211,"o":1},{"id":"29","n":"国立研究開発法人情報通信研究機構(NICT)","a":"X（Transformation）パーク","h":"Hall 6","b":"6H208","d":"『AI・量子時代の社会基盤を創る先端ICTがここに』 AIや量子技術の進展により、社会や産業は大きな変革期を迎えています。 そうした変化をうみ出し、未来の社会を創る基盤となるのが情報通信技術（ICT）です。 CEATEC2026では、情報通信分野を専門とする日本で唯一の公的研究機関であるNICTが取り組む、先端ICTの研究開発をご紹介します。","ini":"さ","rb":220,"o":1},{"id":"83","n":"国立研究開発法人情報通信研究機構(NICT)","a":"ネクストジェネレーションパーク","h":"Hall 4","b":"4H101","d":"情報通信分野を専門とする我が国唯一の公的研究機関である国立研究開発法人情報通信研究機構（NICT）では、地域発ICTスタートアップ創出による地域の課題解決や活性化に向け、ICT人材発掘・事業化支援を行う「全国アクセラレータ・プログラム」を実施。 展示では主に、今年3月に実施の起業家甲子園・起業家万博についてご紹介いたします。","ini":"さ","rb":10,"o":1,"st":1,"t":["学生フレンドリー"],"k":[{"n":"Kick Space Technologies株式会社","b":"4H103"},{"n":"LOOVIC株式会社 🎓","b":"4H111","id":"859"},{"n":"MI-6株式会社","b":"4H113","id":"851"},{"n":"NICTアントレプレナー支援室"},{"n":"株式会社BearBell","b":"4H108"},{"n":"株式会社IDDK","b":"4H105","id":"849"},{"n":"株式会社New Space Intelligence","b":"4H104","id":"856"},{"n":"株式会社RAYVEN","b":"4H112"},{"n":"株式会社Space Weather Company","b":"4H102"},{"n":"株式会社asai","b":"4H107"},{"n":"株式会社アロマジョイン","b":"4H110","id":"853"},{"n":"無罪放免","b":"4H109"},{"n":"金沢医科大学・SPViolet 🎓","b":"4H106","id":"852"}]},{"id":"45","n":"国立研究開発法人情報通信研究機構（NICT）（Beyond 5G(6G)基金事業）","a":"X（Transformation）パーク","h":"Hall 6","b":"6H224","d":"","ini":"さ","rb":221,"o":1},{"id":"149","n":"学校法人情報文化学園アーツカレッジヨコハマ","a":"ネクストジェネレーションパーク","h":"Hall 4","b":"4H124","d":"学生が企画・開発したAndroidアプリ2作品とWeb作品1作品を展示します。 それぞれ異なるテーマや着眼点から、身近な課題や「あったら便利」を、スマートフォンアプリやWebサービスとして形にしました。 会場では、実際の端末やパソコンを使って、各作品の機能や操作性を体験していただけます。 学生ならではの自由な発想から生まれた、三者三様の作品をぜひお試しください。","ini":"さ","rb":18,"o":1,"st":1,"t":["学生フレンドリー"]},{"id":"40","n":"国立研究開発法人新エネルギー・産業技術総合開発機構（NEDO）","a":"一般展示（General Exhibits）","h":"Hall 5","b":"5H440","d":"NEDOが支援する最先端技術を27の展示で紹介。未来の暮らしや産業を支える技術を体感いただけるほか、多彩な研究開発成果を一度にご覧いただけます。是非ご来場ください！","ini":"さ","rb":200,"o":1,"k":[{"n":"Direava株式会社"},{"n":"NABLAS株式会社"},{"n":"NTTドコモビジネス株式会社"},{"n":"カラクリ株式会社"},{"n":"ヒメジ理化株式会社"},{"n":"マグネデザイン株式会社"},{"n":"一般社団法人 自動車・蓄電池トレーサビリティ推進センター"},{"n":"一般社団法人AIロボット協会"},{"n":"一般財団法人日本自動車研究所"},{"n":"京都工芸繊維大学"},{"n":"住友ゴム工業株式会社"},{"n":"名古屋大学"},{"n":"国立研究開発法人産業技術総合研究所"},{"n":"埼玉大学"},{"n":"学校法人新潟工科大学"},{"n":"東レ株式会社"},{"n":"株式会社Thinker"},{"n":"株式会社オー・エル・エム・デジタル"},{"n":"株式会社チトセロボティクス"},{"n":"株式会社ティアフォー"},{"n":"株式会社デンソー"},{"n":"株式会社プレシジョン"},{"n":"株式会社国際電気通信基礎技術研究所"},{"n":"横浜国立大学"},{"n":"芝浦工業大学"}]},{"id":"96","n":"株式会社CINCA","a":"ネクストジェネレーションパーク","h":"Hall 4","b":"4H320","d":"「レンタル新規事業室」は、新規事業立ち上げに特化したサービスです。必要なときだけ、新規事業室をレンタル可能！少人数のゼネラリストが、アイデア創出、顧客検証、PoC・MVP開発、事業立ち上げまでを実行します。「社内で事業推進できる人材が不足している」「新規事業の立ち上げ方が分からない」「リスクコントロールが求められる」など新規事業立ち上げにお悩みを抱えている企業は、お気軽にご相談ください。","ini":"さ","rb":90,"o":1},{"id":"333","n":"THINKING Electronic Industrial Co., Ltd.","a":"一般展示（General Exhibits）","h":"Hall 8","b":"8H019","d":"","ini":"A-Z","rb":324,"o":1},{"id":"1233","n":"株式会社シンク","a":"X（Transformation）パーク","h":"Hall 5","b":"5H405","d":"ブラックボックス化したシステムの放置は長引けば長引くだけその改修リスクも増大して行きます。「脱レガシー」への対策が待ったなしの今、当社は、現在のシステムを運用しながら段階的にDX化を進めていくアプローチとしてWrap & Adaptをご提案いたします。ローコードプラットフォームMENDIXを活用した多様な接続性と先進的開発性能と共に、是非当社ブースにて最先端のリスクフリー技術をご体験ください。","ini":"さ","rb":189,"o":1,"st":1,"t":["💬 ブース対応可能言語：英語","学生フレンドリー"]},{"id":"52","n":"シンコー株式会社","a":"一般展示（General Exhibits）","h":"Hall 8","b":"8H128","d":"材料開発から精密機械加工まで、一貫生産への対応が可能です。高い技術力で最適なソリューションをご提供します。 ・受託加工（セラミックス、ガラス、金属・複合材、樹脂材料の精密機械加工） ・加工内容：研削、切断、溝入れ、ラップ、洗浄、寸法・外観検査、他 ・材料開発・製造（ペルチェ素子）","ini":"さ","rb":349,"o":1},{"id":"390","n":"Shenzhen Grepow Battery Co., Lt ","a":"ネクストジェネレーションパーク","h":"Hall 4","b":"4H143","d":"株式会社ZeroOneは、リアルな空間をデータ化するデジタルツイン・AIソリューションを開発しています。製造業向け「ZEKOO」は設備稼働や人の動き、安全データを可視化し、現場の生産性と安全性を向上。リテール向け「Hanjo」は人流や顧客行動をAI解析し、店舗運営の効率化と施策強化を実現します。","ini":"さ","rb":34,"o":1},{"id":"365","n":"株式会社ゼロワンブースター","a":"X（Transformation）パーク","h":"Hall 6","b":"6H135","d":"","ini":"さ","rb":215,"o":0},{"id":"109","n":"全景ソフトウェア","a":"一般展示（General Exhibits）","h":"Hall 7","b":"7H413","d":"製品概要・システム構成・量産の目標時期をお聞かせください。構成図やMCU／OS、通信方式、既存ファームウェアなどの資料があれば、より具体的なご提案が可能です。資料をお持ちでない段階でもご相談いただけます。","ini":"さ","rb":286,"o":1,"k":[{"n":"Cybertrust Japan Co., Ltd."}]},{"id":"91","n":"全国電子部品流通連合会","a":"一般展示（General Exhibits）","h":"Hall 8","b":"8H304","d":"当連合会は、電子部品、制御部品を中心とした製品とサービスの提供をおこなう業界団体の連合会です。 現在、6つの業界団体が相互に連携しあい、当業界の繁栄と進展に努めています。 当連合会は会員企業や構成団体ともども、これからも組織活動を通じて、電子部品流通の発展を促進します。メーカーと協力して流通業者としての社会的な使命を達成することと、国民経済の発展に寄与していきます。","ini":"さ","rb":376,"o":1},{"id":"185","n":"仙台市","a":"一般展示（General Exhibits）","h":"Hall 7","b":"7H331","d":"IT・デジタルコンテンツ関連企業等を対象とした助成制度を拡充し、オフィス賃料を最大2年分助成します。サービスオフィスなどを活用したスモールスタートにも対応。都心部では高機能オフィスの整備が進んでおり、事業展開を後押しする環境が充実しています。担当職員が制度の概要や活用要件を直接ご説明します。","ini":"さ","rb":271,"o":1},{"id":"90","n":"総合学園ヒューマンアカデミー IT＆ビジネスカレッジ","a":"ネクストジェネレーションパーク","h":"Hall 4","b":"4H305","d":"アイディアソンから合宿、数ヶ月の延長開発を経て選抜された2つの学生プロダクト！ 顔認証で“見守りと応援”を届ける学習支援アプリ「おやこコネクト」と、チームのスキマ時間を自動抽出する「AidaMatch」を展示します。 日常の悩みから生まれたアイデアを、半年間本気で磨き上げました。ぜひブースで学生の成果を体験してください！","ini":"さ","rb":80,"o":1,"st":1,"t":["学生フレンドリー"]},{"id":"1270","n":"総務省","a":"X（Transformation）パーク","h":"Hall 5","b":"5H302","d":"","ini":"さ","rb":178,"o":0},{"id":"66","n":"創屋株式会社","a":"一般展示（General Exhibits）","h":"Hall 7","b":"7H422","d":"「あの資料、どこだっけ？」をAIが解決。Tadorie（タドリエ）は、社内に眠る図面や見積書・仕様書・議事録などをAIが読み解き、話し言葉の質問から必要な情報を根拠資料付きで示すAIナレッジ探索システムです。キーワード検索と意味検索の併用で表現の揺れにも対応。設計・製造向けには2D/3D類似図面検索や、案件・部品と図面をつなぐPDM機能も搭載。ファイル整理不要、今ある保管場所のまま導入できます。","ini":"さ","rb":294,"o":1,"k":[{"n":"株式会社アルパイン設計事務所","id":"1267"}]},{"id":"300","n":"ソニーグループ株式会社","a":"ネクストジェネレーションパーク","h":"Hall 4","b":"4H450 ","a":"ネクストジェネレーションパーク","h":"Hall 4","b":"4H413","d":"🌈 すべての建物を、美しい発電所に。 東京科学大学の研究チームが開発した着色BIPV（建材一体型太陽電池）モジュールをご紹介します。 白、ピンク、ブルー、金色など多彩な色彩を実現しながら、高い発電効率を維持し、軽量化とも両立。 建物の壁面や窓ガラスが、そのまま美しい発電設備になる――。そんな未来の建材をご覧ください。 🎨 着色モジュールサンプルを展示","ini":"た","rb":115,"o":1},{"id":"127","n":"東京工科大学","a":"ネクストジェネレーションパーク","h":"Hall 4","b":"4H401-406","d":"","ini":"た","rb":110,"o":0},{"id":"130","n":"東京高専・水戸研究室/仙台高専広瀬キャンパス・小林研究室/泰興物産株式会社","a":"ネクストジェネレーションパーク","h":"Hall 4","b":"4H114","d":"","ini":"た","rb":11,"o":0},{"id":"202","n":"東京大学/慶應義塾大学/静岡大学(D3-AIプロジェクト)","a":"ネクストジェネレーションパーク","h":"Hall 4","b":"4H307","d":"D3-AI: 多様性と環境変化に寄り添う分散機械学習基盤の創出","ini":"た","rb":81,"o":1},{"id":"255","n":"東京電機大学 協調ロボティクス研究室","a":"ネクストジェネレーションパーク","h":"Hall 4","b":"4H309","d":"本研究室は，新しい人工知能研究領域である 「協調」 に関する幅広い研究を行っています． ヒトの気持ちを察し，ジブンの動きが相手に与える影響を予測することができれば， きっと 空気を読めるロボットが実現できると考えています． これを究極の目標として，様々な基礎研究を行っています．","ini":"た","rb":82,"o":1,"st":1,"t":["学生フレンドリー"]},{"id":"366","n":"東京都スタートアップ戦略推進本部","a":"一般展示（General Exhibits）","h":"Hall 7","b":"7H101","d":"","ini":"た","rb":234,"o":0,"k":[{"n":"CalTa株式会社"},{"n":"Green Carbon株式会社"},{"n":"inQs株式会社"},{"n":"株式会社スペースワン"}]},{"id":"73","n":"東京都中小企業振興公社（東京ビジネスフロンティア）","a":"一般展示（General Exhibits）","h":"Hall 6","b":"6H140","d":"","ini":"た","rb":216,"o":0,"st":1,"k":[{"n":"AMX株式会社","id":"1271"},{"n":"Plus Insight株式会社","id":"1276"},{"n":"ノヴェルバリューテクノロジー株式会社","id":"1286"},{"n":"信和産業株式会社"},{"n":"株式会社DAVVERO","id":"1290"},{"n":"株式会社Datailo","id":"1285"},{"n":"株式会社DayBridge 🎓","id":"1278"},{"n":"株式会社ELPJ TECHNOLOGY","id":"1281"},{"n":"株式会社IDEOJ","id":"1274"},{"n":"株式会社Power Diamond Systems"},{"n":"株式会社カラーチップス","id":"1273"},{"n":"株式会社クライム","id":"1277"},{"n":"株式会社ジッテ","id":"1282"},{"n":"株式会社テレパワー","id":"1280"},{"n":"株式会社新栄スクリーン"},{"n":"株式会社村松製作所","id":"1284"},{"n":"株式会社特殊金属エクセル 🎓","id":"1287"},{"n":"株式会社空間創造研究所","id":"1275"},{"n":"株式会社西川精機製作所"},{"n":"電子磁気工業株式会社","id":"1279"}]},{"id":"310","n":"東京都 デジタルツイン実現プロジェクト","a":"一般展示（General Exhibits）","h":"Hall 8","b":"8H211","d":"本ブ its）","h":"Hall 8","b":"8H223","d":"TransferJet Xは、無線LANや、LTE/5Gと違い、1対1通信なので、周囲の環境で通信速度が落ちることがありません。 人の多い展示会や、パブリックスペースで利用しても、必ず高速通信することが可能です。 TransferJet Xの実力をご覧いただけます","ini":"た","rb":369,"o":1},{"id":"376","n":"DREAMBEER","a":"一般展示（General Exhibits）","h":"Hall 7","b":"7H209","d":"","ini":"A-Z","rb":248,"o":0},{"id":"226","n":"株式会社トルネックス","a":"一般展示（General Exhibits）","h":"Hall 8","b":"8H121","d":"","ini":"た","rb":342,"o":0},{"id":"35","n":"トレンサーテクノロジーソリューション","a":"一般展示（General Exhibits）","h":"Hall 7","b":"7H432","d":"Trenserは、AIを活用したクラウド、Web、モバイル、組み込みソリューションを提供する、ソフトウェアエンジニアリングに特化した企業です。同社の強みは、医療画像・コネクテッドヘルスケア、産業オートメーション、スマートインフラ、小売、デジタルメディアといった分野に及びます。Trenserは、高品質な開発プロセスを駆使し、複雑なアイデアを信頼性の高いソフトウェアへと具現化します。","ini":"た","rb":297,"o":1},{"id":"137","n":"Dongguan Y-Star Precision Manufacturing Co.,Ltd.","a":"一般展示（General Exhibits）","h":"Hall 7","b":"7H207","d":"","ini":"A-Z","rb":246,"o":0},{"id":"133","n":"DONGGUAN CE LINK LIMITED","a":"一般展示（General Exhibits）","h":"Hall 6","b":"6H021","d":"","ini":"A-Z","rb":207,"o":1},{"id":"95","n":"内閣府宇宙開発戦略推進事務局/準天頂衛星システムサービス株式会社","a":"一般展示（General Exhibits）","h":"Hall 8","b":"8H130","d":"本展示会では、準天頂衛星システム「みちびき」の特徴や仕組みなどの概要紹介に加え、「みちびき」が提供するサービスに対応した製品、対応ソリューション等を展示いたします。","ini":"な","rb":351,"o":1},{"id":"1448","n":"内閣府地方創生推進事務局","a":"一般展示（General Exhibits）","h":"ホール未定","b":"","d":"","ini":"な","rb":393,"o":0},{"id":"27","n":"中日本高速道路株式会社","a":"一般展示（General Exhibits）","h":"Hall 5","b":"5H260","d":"","ini":"な","rb":175,"o":0},{"id":"306","n":"学校法人電波学園 名古屋工学院専門学校","a":"ネクストジェネレーションパーク","h":"Hall 4","b":"4H317","d":"名古屋工学院専門学校 コンピューター・IT分野がCEATECに初出展します。AIをはじめとする先端デジタル技術を活用し、社会課題の解決や未来社会の実現に挑む学生プロジェクトを展示します。自由な発想から生まれたアイデアを、実践的な技術力によって形にした開発成果を通じて、未来のエンジニアたちが描く新たな可能性をご体感ください。","ini":"な","rb":88,"o":1,"st":1,"t":["学生フレンドリー"]},{"id":"206","n":"名古屋大学","a":"ネクストジェネレーションパーク","h":"Hall 4","b":"4H311","d":"当研究グループでは、1台で3次元方向の振動を発生できる新しい振動モータ「XReactor」を開発しています。本ブースでは、XReactorを手に持つことで、実際には移動していないにもかかわらず、特定の方向に引っ張られるように感じる「3次元牽引錯覚」を体験いただけます。ぜひ、新しい3次 ネクストジェネレーションパーク","h":"Hall 4","b":"4H310","d":"感情や注意の状態を、脳波（EEG）信号から直接読み取ります。使用するのは、導電ペーストなしでも頭皮にぴったり密着する生体適合性のハイドロゲル電極です。そこで得られた脳波の振動パターンを、独自開発のアルゴリズムによって解析し、認知負荷や感情の状態（ポジティブ／ネガティブの度合い）といった、人にとって分かりやすい指標に変換します。","ini":"わ","rb":83,"o":1}];
const DETAIL = 'https://www.ceatec.com/ja/exhibition/detail.html?id=';
const AREA = {
  '一般展示（General Exhibits）':{s:'一般展示',c:'--a-gen'},
  'X（Transformation）パーク':{s:'Xパーク',c:'--a-x'},
  'ネクストジェネレーションパーク':{s:'ネクストジェネレーションパーク',c:'--a-next'},
  'グローバルパーク':{s:'グローバルパーク',c:'--a-global'}
};
const KEY = 'ceatec2026-visit';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// 出展者と共同出展者を1つの索引に（キーは p親ID / p親ID-連番）
const ITEMS = {};
DATA.forEach(p => {
  p.key = 'p' + p.id;
  ITEMS[p.key] = {key:p.key, n:p.n, a:p.a, h:p.h, b:p.b, rb:p.rb, rn:0, id:p.o ? p.id : '', parent:null};
  (p.k || []).forEach((k, i) => {
    k.key = p.key + '-' + i;
    ITEMS[k.key] = {key:k.key, n:k.n, a:p.a, h:p.h, b:k.b || p.b, rb:p.rb, id:k.id || '', parent:p.n};
  });
  p.hay = (p.n + ' ' + p.d + ' ' + p.b + ' ' + (p.k || []).map(k => k.n).join(' ')).toLowerCase();
});
DATA.forEach((p, i) => p.rn = i);

let S = {};
try { S = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { S = {}; }
for (const k in S) if (!ITEMS[k]) delete S[k];
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

const F = {q:'', area:'', hall:'', sort:'name', student:false, on:false};
try { Object.assign(F, JSON.parse(sessionStorage.getItem(KEY + '-f') || '{}')); } catch (e) {}

function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 1800); }
function tally(){
  const v = Object.values(S);
  $('#cGo').textContent = v.length;
  $('#cDone').textContent = v.filter(x => x.v).length;
  $('#tabPlan').textContent = '訪問プラン（' + v.length + '）';
}

/* ---------- 出展者を選ぶ ---------- */
function boothHTML(b, area){
  const c = AREA[area] ? `style="--c:var(${AREA[area].c})"` : '';
  return b ? `<span class="booth" ${c}>${esc(b)}</span>` : `<span class="booth none">未定</span>`;
}
function rowHTML(p){
  const ar = AREA[p.a] || {s:p.a, c:'--muted'};
  const on = !!S[p.key];
  const tags = (p.t || []).map(t => `<span class="tag">${esc(t.replace(/^💬\s*/, ''))}</span>`).join('');
  const kids = p.k ? `<ul class="kids">${p.k.map(k => `
      <li class="${S[k.key] ? 'on' : ''}"><input type="checkbox" class="ck" id="c_${k.key}" data-k="${k.key}" ${S[k.key] ? 'checked' : ''}>
        <label for="c_${k.key}">${esc(k.n)}</label>${k.b ? `<span class="booth">${esc(k.b)}</span>` : ''}
        ${k.id ? `<a href="${DETAIL + k.id}" target="_blank" rel="noopener" style="color:var(--accent);font-size:.78rem">詳細</a>` : ''}</li>`).join('')}</ul>` : '';
  return `<article class="ex ${on ? 'on' : ''}" data-row="${p.key}">
    <input type="checkbox" class="ck" id="c_${p.key}" data-k="${p.key}" ${on ? 'checked' : ''} aria-label="${esc(p.n)} を訪問リストに追加">
    <div style="min-width:0">
      <h3><label for="c_${p.key}">${esc(p.n)}</label></h3>
      <div class="meta"><span class="area" style="--c:var(${ar.c})"><span class="dot"></span>${esc(ar.s)}</span><span>${esc(p.h)}</span>${p.k ? `<span class="tag">共同出展 ${p.k.length}社</span>` : ''}${tags}</div>
    </div>
    <div class="booth-col">${boothHTML(p.b, p.a)}</div>
    ${p.d ? `<p class="desc" title="タップで全文">${esc(p.d)}</p>` : ''}
    ${p.o ? `<div class="links"><a href="${DETAIL + p.id}" target="_blank" rel="noopener">公式の出展者ページ ↗</a></div>` : ''}
    ${kids}
  </article>`;
}
function renderList(){
  const q = F.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  let rows = DATA.filter(p =>
    (!F.area || p.a === F.area) && (!F.hall || p.h === F.hall) && (!F.student || p.st) &&
    (!F.on || S[p.key] || (p.k || []).some(k => S[k.key])) &&
    q.every(w => p.hay.includes(w)));
  rows.sort(F.sort === 'booth' ? (a, b) => a.rb - b.rb : (a, b) => a.rn - b.rn);
  $('#hit').textContent = rows.length + ' / ' + DATA.length + ' 社';
  $('#list').innerHTML = rows.length ? rows.map(rowHTML).join('') : `<p class="empty">条件に合う出展者がありません。検索語や絞り込みを変えてください。</p>`;
  try { sessionStorage.setItem(KEY + '-f', JSON.stringify(F)); } catch (e) {}
}
function initControls(){
  const areas = $('#areas');
  const mk = (val, label, c) => `<button class="chip" data-area="${esc(val)}" aria-pressed="${F.area === val}">${c ? `<span class="dot" style="--c:var(${c})"></span>` : ''}${esc(label)}</button>`;
  areas.innerHTML = mk('', 'すべてのエリア') + Object.entries(AREA).map(([k, v]) => mk(k, v.s, v.c)).join('');
  areas.addEventListener('click', e => {
    const b = e.target.closest('[data-area]'); if (!b) return;
    F.area = b.dataset.area;
    areas.querySelectorAll('[data-area]').forEach(x => x.setAttribute('aria-pressed', x.dataset.area === F.area));
    renderList();
  });
  const halls = [...new Set(DATA.map(p => p.h))].sort((a, b) => (a.match(/\d+/) ? 0 : 1) - (b.match(/\d+/) ? 0 : 1) || a.localeCompare(b, 'ja', {numeric:true}));
  $('#hall').insertAdjacentHTML('beforeend', halls.map(h => `<option>${esc(h)}</option>`).join(''));
  $('#hall').value = F.hall; $('#sort').value = F.sort; $('#q').value = F.q;
  $('#fStudent').setAttribute('aria-pressed', F.student); $('#fOn').setAttribute('aria-pressed', F.on);
  $('#hall').onchange = e => { F.hall = e.target.value; renderList(); };
  $('#sort').onchange = e => { F.sort = e.target.value; renderList(); };
  let tm; $('#q').oninput = e => { clearTimeout(tm); tm = setTimeout(() => { F.q = e.target.value; renderList(); }, 120); };
  $('#fStudent').onclick = e => { F.student = !F.student; e.currentTarget.setAttribute('aria-pressed', F.student); renderList(); };
  $('#fOn').onclick = e => { F.on = !F.on; e.currentTarget.setAttribute('aria-pressed', F.on); renderList(); };
  $('#list').addEventListener('change', e => {
    const k = e.target.dataset.k; if (!k) return;
    if (e.target.checked) S[k] = S[k] || {v:0, m:''}; else delete S[k];
    e.target.closest('li, .ex').classList.toggle('on', e.target.checked);
    save(); tally();
  });
  $('#list').addEventListener('click', e => { if (e.target.classList.contains('desc')) e.target.classList.toggle('open'); });
}

/* ---------- 訪問プラン ---------- */
const hallOrder = h => { const m = h.match(/\d+/); return m ? +m[0] : 99; };
function planItems(){
  return Object.keys(S).map(k => ITEMS[k]).sort((a, b) => hallOrder(a.h) - hallOrder(b.h) || a.rb - b.rb || (a.parent ? 1 : 0) - (b.parent ? 1 : 0));
}
function renderPlan(){
  const items = planItems();
  if (!items.length){
    $('#halls').innerHTML = '';
    $('#planBody').innerHTML = `<p class="empty">まだ選ばれていません。「出展者を選ぶ」でチェックを入れると、ここにホール別・ブース番号順で並びます。</p>`;
    return;
  }
  const groups = {};
  items.forEach(it => (groups[it.h] = groups[it.h] || []).push(it));
  const hs = Object.keys(groups);
  $('#halls').innerHTML = hs.map(h => { const g = groups[h]; const d = g.filter(x => S[x.key].v).length;
    return `<a href="#h${hallOrder(h)}">${esc(h)}　<b>${d}/${g.length}</b></a>`; }).join('');
  $('#planBody').innerHTML = hs.map(h => `<section class="hall" id="h${hallOrder(h)}">
      <h2>${esc(h)}<small>${groups[h].length} 件</small></h2>
      ${groups[h].map(it => { const s = S[it.key]; return `<div class="pl ${s.v ? 'done' : ''}" data-k="${it.key}">
        <input type="checkbox" class="ck" id="v_${it.key}" ${s.v ? 'checked' : ''} aria-label="${esc(it.n)} を訪問済にする">
        ${boothHTML(it.b, it.a)}
        <label class="nm" for="v_${it.key}">${esc(it.n)}${it.parent ? `<small>${esc(it.parent)} の共同出展</small>` : ''}</label>
        <button class="x" title="リストから外す" aria-label="${esc(it.n)} をリストから外す">×</button>
        <input class="memo" id="m_${it.key}" value="${esc(s.m)}" placeholder="メモ（聞きたいこと・担当者名など）">
      </div>`; }).join('')}
    </section>`).join('');
}
function initPlan(){
  const body = $('#planBody');
  body.addEventListener('change', e => {
    const row = e.target.closest('.pl'); if (!row) return;
    const s = S[row.dataset.k];
    if (e.target.classList.contains('ck')) { s.v = e.target.checked ? 1 : 0; row.classList.toggle('done', !!s.v); renderHallChips(); }
    save(); tally();
  });
  body.addEventListener('input', e => {
    if (!e.target.classList.contains('memo')) return;
    S[e.target.closest('.pl').dataset.k].m = e.target.value; save();
  });
  body.addEventListener('click', e => {
    if (!e.target.classList.contains('x')) return;
    delete S[e.target.closest('.pl').dataset.k]; save(); tally(); renderPlan();
  });
  $('#copyText').onclick = () => {
    let cur = '', out = ['CEATEC 2026 訪問リスト'];
    planItems().forEach(it => {
      if (it.h !== cur) { cur = it.h; out.push('', '■ ' + it.h); }
      const s = S[it.key];
      out.push(`${s.v ? '☑' : '☐'} ${it.b || '未定'}  ${it.n}${it.parent ? '（' + it.parent + '）' : ''}${s.m ? '  … ' + s.m : ''}`);
    });
    copy(out.join('\n'), 'テキストをコピーしました');
  };
  $('#copyCode').onclick = () => {
    const code = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    $('#code').value = code; copy(code, 'コードをコピーしました');
  };
  $('#loadCode').onclick = () => {
    try {
      const obj = JSON.parse(decodeURIComponent(escape(atob($('#code').value.trim()))));
      let n = 0;
      for (const k in obj) if (ITEMS[k]) { S[k] = {v:obj[k].v ? 1 : 0, m:String(obj[k].m || '')}; n++; }
      save(); tally(); renderPlan(); toast(n + ' 件を読み込みました');
    } catch (e) { toast('コードを読めませんでした。コピーした文字列を全部貼り付けてください'); }
  };
  $('#clearAll').onclick = () => { $('#clearYes').hidden = false; setTimeout(() => $('#clearYes').hidden = true, 4000); };
  $('#clearYes').onclick = () => { S = {}; save(); tally(); renderPlan(); $('#clearYes').hidden = true; toast('すべて解除しました'); };
}
function renderHallChips(){ const y = scrollY; renderPlanChipsOnly(); scrollTo(0, y); }
function renderPlanChipsOnly(){
  const groups = {};
  planItems().forEach(it => (groups[it.h] = groups[it.h] || []).push(it));
  $('#halls').innerHTML = Object.keys(groups).map(h => { const g = groups[h]; const d = g.filter(x => S[x.key].v).length;
    return `<a href="#h${hallOrder(h)}">${esc(h)}　<b>${d}/${g.length}</b></a>`; }).join('');
}
function copy(text, msg){
  const fallback = () => { const c = $('#code'); c.value = text; c.focus(); c.select(); toast('選択しました。Ctrl+C（長押し→コピー）でコピーしてください'); };
  try { navigator.clipboard.writeText(text).then(() => toast(msg), fallback); } catch (e) { fallback(); }
}

/* ---------- タブ ---------- */
function show(tab){
  const plan = tab === 'plan';
  $('#pick').hidden = plan; $('#plan').hidden = !plan;
  $('#tabPick').setAttribute('aria-selected', !plan); $('#tabPlan').setAttribute('aria-selected', plan);
  if (plan) renderPlan(); else renderList();
  scrollTo(0, 0);
}
$('#tabPick').onclick = () => show('pick');
$('#tabPlan').onclick = () => show('plan');

$('#nEx').textContent = DATA.length;
$('#nKid').textContent = DATA.reduce((s, p) => s + (p.k ? p.k.length : 0), 0);
initControls(); initPlan(); tally(); renderList();
</script>
